<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>min_content_width_page</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: grid;
            place-items: center;
        }

        /* min-content width: shrink to widest unbreakable item (approx). */
        .box {
            display: inline-block;
            background: #f4f4f4;
        }

        .c1 {
            width: 50px;
            height: 20px;
            background: rgba(0, 0, 0, 0.10);
        }

        .c2 {
            width: 80px;
            height: 20px;
            background: rgba(0, 0, 0, 0.18);
        }
    </style>
</head>

<body>
    <!-- Mirrors: MinContentWidthPage -> container width becomes max(50, 80)=80; auto height stacks children -->
    <div class="box">
        <div class="c1"></div>
        <div class="c2"></div>
    </div>
</body>

</html>
