<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>nested_layout_page</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: grid;
            place-items: center;
        }

        .parent {
            width: 200px;
            background: #f4f4f4;
            padding: 0;
        }

        .child {
            width: 100px;
            height: 50px;
            background: #ddd;
            margin: 0;
        }
    </style>
</head>

<body>
    <!-- Mirrors: NestedLayoutPage -> HtmlDiv(200px width, auto height) with two 100x50 children stacked -->
    <div class="parent">
        <div class="child"></div>
        <div class="child"></div>
    </div>
</body>

</html>
