<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BoxShadowPage - HtmlDiv Box-Shadow 示例</title>
    <!-- 对应 Flutter: flutter/example/lib/pages/box_shadow_page.dart -->
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: #f4f4f4;
            color: #111;
        }

        .page {
            padding: 16px;
            max-width: 980px;
            margin: 0 auto;
        }

        h1 {
            font-size: 18px;
            margin: 0 0 12px;
        }

        h2 {
            font-size: 14px;
            margin: 16px 0 8px;
        }

        .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .col {
            flex: 1 1 360px;
            min-width: 280px;
        }

        .label {
            font-size: 12px;
            color: #333;
            margin: 0 0 6px;
        }

        .center {
            display: flex;
            justify-content: center;
        }

        .box {
            box-sizing: border-box;
            width: 260px;
            height: 100px;
            border-radius: 0;
            border: 1px solid rgba(0, 0, 0, 0.1);
            background: #fff;
        }

        .h90 {
            height: 90px;
        }

        .h110 {
            height: 110px;
        }

        .r12 {
            border-radius: 12px;
        }

        .r14 {
            border-radius: 14px;
        }

        .r16 {
            border-radius: 16px;
        }

        .r18 {
            border-radius: 18px;
        }

        .bg-img {
            background-image: url("../../assets/test1.png");
            background-repeat: repeat;
            background-size: auto;
            background-position: 0 0;
        }
    </style>
</head>

<body>
    <div class="page">
        <h1>HtmlDiv Box-Shadow 示例（HTML/CSS 近似对照）</h1>

        <h2>基础：单个外阴影</h2>
        <div class="label">offset(0,8) blur 18 spread 0</div>
        <div class="center">
            <div class="box r12" style="box-shadow: 0 8px 18px 0 rgba(0,0,0,0.2);"></div>
        </div>

        <h2>组合：多重外阴影</h2>
        <div class="label">两层 shadow</div>
        <div class="center">
            <div class="box r16"
                style="background:#fdfdfd; box-shadow: 0 12px 24px 0 rgba(0,0,0,0.13), 0 2px 6px 0 rgba(0,0,0,0.08);">
            </div>
        </div>

        <h2>spread：扩张阴影区域</h2>
        <div class="row">
            <div class="col">
                <div class="label">spread 0</div>
                <div class="center">
                    <div class="box h90 r14" style="box-shadow: 0 6px 14px 0 rgba(0,0,0,0.2);"></div>
                </div>
            </div>
            <div class="col">
                <div class="label">spread 6</div>
                <div class="center">
                    <div class="box h90 r14" style="box-shadow: 0 6px 14px 6px rgba(0,0,0,0.2);"></div>
                </div>
            </div>
        </div>

        <h2>百分比 offset：相对盒子宽高</h2>
        <div class="label">offsetPercent(dx: 10%, dy: 12%)（CSS 不支持百分比 offset，这里按 260x110 换算为 26px / 13.2px）</div>
        <div class="center">
            <div class="box h110 r12 bg-img" style="box-shadow: 26px 13.2px 18px 0 rgba(0,0,0,0.2);"></div>
        </div>

        <h2>inset：内阴影（近似）</h2>
        <div class="row">
            <div class="col">
                <div class="label">inset + offset(0,6) blur 14</div>
                <div class="center">
                    <div class="box h110 r18"
                        style="background:#e3f2fd; box-shadow: inset 0 6px 14px 0 rgba(0,0,0,0.33);"></div>
                </div>
            </div>
            <div class="col">
                <div class="label">outer + inset 叠加</div>
                <div class="center">
                    <div class="box h110 r18"
                        style="background:#fff8e1; box-shadow: 0 10px 22px 0 rgba(0,0,0,0.15), inset 0 6px 14px 0 rgba(0,0,0,0.27);">
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
