<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>auto_size_width_page</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: grid;
            place-items: center;
        }

        .outer {
            width: 300px;
            height: 300px;
            position: relative;
            background: #f4f4f4;
        }

        /* Auto width: shrink-to-fit (approx) -> use inline-block */
        .box {
            display: inline-block;
            height: 50px;
            background: #ddd;
        }
    </style>
</head>

<body>
    <!-- Mirrors: AutoSizeWidthPage -> 300x300, top-left aligned auto-width box with fixed height -->
    <div class="outer">
        <div class="box">&nbsp;</div>
    </div>
</body>

</html>
