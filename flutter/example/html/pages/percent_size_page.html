<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>percent_size_page</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: grid;
            place-items: center;
        }

        .outer {
            width: 200px;
            height: 200px;
            display: grid;
            place-items: center;
            background: #f4f4f4;
        }

        .box {
            width: 50%;
            height: 25%;
            background: #ddd;
        }
    </style>
</head>

<body>
    <!-- Mirrors: PercentSizePage -> 200x200 container, centered HtmlDiv(50% x 25%) -->
    <div class="outer">
        <div class="box"></div>
    </div>
</body>

</html>
